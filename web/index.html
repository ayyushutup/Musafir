<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary Meta Tags -->
  <title>Musafir — Community & Event Discovery in Mumbai</title>
  <meta name="title" content="Musafir — Community & Event Discovery in Mumbai">
  <meta name="description" content="Discover local events, interest communities, and meet people attending the same events in Mumbai. I want to go, but I don't want to go alone.">
  <meta name="theme-color" content="#FF6B35">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Musafir — Community & Event Discovery in Mumbai">
  <meta property="og:description" content="Find communities, discover local events, and meet companions in Mumbai.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Musafir">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0A0F;
      color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #FF6B35 0%, #E94560 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 14px;
      color: #9898A6;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 107, 53, 0.2);
      border-radius: 50%;
      border-top-color: #FF6B35;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo">Musafir</div>
    <div class="tagline">I want to go, but I don't want to go alone.</div>

  </div>

  <script src="flutter_bootstrap.js" async></script>
